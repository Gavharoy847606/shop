name: CI/CD Enterprise ERP Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni GitHub'dan tortib olish
        uses: actions/checkout@v4

      # Paketlar talab qilayotgan Node.js 22 versiyasini o'rnatamiz
      - name: Node.js muhitini sozlash
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      # Monorepo va lock-file xatolarini chetlab o'tish uchun professional yondashuv
      - name: Frontend paketlarini o'rnatish
        run: |
          cd frontend
          npm install --no-audit --no-fund
          
      - name: Docker sozlanganligini tekshirish
        run: |
          docker compose config

  deploy-to-render:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Render Webhook orqali Deploy buyrug'ini yuborish
        run: |
          curl -X POST "${{ secrets.RENDER_FRONTEND_WEBHOOK }}"