name: CI/CD Enterprise ERP Pipeline

# 1. Pipeline qachon ishga tushishi kerakligini belgilaymiz
on:
  push:
    branches:
      - main # main branchga har safar push bo'lganda ishlaydi

jobs:
  # Birinchi bosqich: Kod sifatini va Docker buildni tekshirish (Continuous Integration)
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni GitHub'dan tortib olish
        uses: actions/checkout@v4

      - name: Node.js muhitini sozlash
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Frontend paketlarini o'rnatish va tekshirish
        run: |
          cd frontend
          npm ci
          
      - name: Docker sozlanganligini tekshirish
        run: |
          docker compose config

  # Ikkinchi bosqich: Avtomatik ravishda Render bulutiga deploy qilish (Continuous Deployment)
  deploy-to-render:
    needs: test-and-build # Faqat build bosqichi muvaffaqiyatli o'tsa ishga tushadi
    runs-on: ubuntu-latest
    steps:
      - name: Render Webhook orqali Deploy buyrug'ini yuborish
        run: |
          curl -X POST "${{ secrets.RENDER_FRONTEND_WEBHOOK }}"